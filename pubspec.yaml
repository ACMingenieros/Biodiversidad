name: biodiversidad
description: >-
  Interactive Augmented Reality biodiversity guide featuring Ukumari, the Andean
  Spectacled Bear (Tremarctos ornatus), with real-time 3D skeletal animations,
  morph-target lip-sync, voice recognition, and AI-powered conservation Q&A.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.0.0
  ar_flutter_plugin:
    path: packages/ar_flutter_plugin
  vector_math: ^2.2.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.3
  mobile_scanner: ^7.5.0
  http: ^1.2.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/Ukumari_Meshy_Mixamo_v3.glb
    - assets/content/oso_contenido.json
    - assets/ar_stage/stage.html
    - assets/ar_stage/audio_stage.html
    - assets/images/logo_biodiversidad_unsm.png
    - assets/images/ukumari_preview.png
    - assets/images/mapa_ruta_biodiversidad.png
    - assets/audio/saludo_inicial.mp3
    - assets/audio/como_llegar.mp3
    - assets/audio/que_hay.mp3
